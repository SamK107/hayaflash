name: Audit dependances (CVE)

# Veille CVE automatisee (GOVERNANCE_SECURITE.md categorie 9) : pip-audit
# compare requirements.txt a la base PyPA/OSV. Separe de ci.yml pour ne pas
# bloquer un merge a cause d'une CVE publiee la veille sur une dependance
# indirecte -- l'echec de ce workflow est un signal a traiter, pas un gate.
# GitHub envoie un email au proprietaire du repo quand un run planifie echoue.

on:
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ["requirements.txt"]

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc on
