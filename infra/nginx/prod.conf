# infra/nginx/prod.conf — Reverse proxy HayaFlash (production)
#
# NOTE — templating : ce fichier est monté en tant que template envsubst
# (/etc/nginx/templates/default.conf.template dans docker-compose.production.yml),
# PAS en tant que .conf statique. C'est l'entrypoint officiel de l'image
# nginx qui exécute `envsubst` dessus au démarrage du conteneur et écrit le
# résultat dans /etc/nginx/conf.d/default.conf. Il ne substitue QUE les
# variables réellement présentes dans l'environnement du conteneur nginx
# (voir `environment: PROD_DOMAIN` sur le service nginx) — les variables
# nginx natives comme $host, $remote_addr, $scheme, etc. ne matchent aucun
# nom de variable d'environnement et restent donc intactes.

# ── Rate limiting zones ────────────────────────────────────────────────────────
# Zone générale : 30 req/s par IP
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
# Zone API orders : 120 req/min (2 r/s) par IP, burst 40 (anti-flood ; CGNAT :
# large volontairement, la finesse est par numero cote Django). Django applique
# le meme plafond (ORDER_SUBMIT_RATE_MAX_PER_WINDOW) : a relever ensemble.
limit_req_zone $binary_remote_addr zone=api_orders:10m rate=120r/m;
# Zone login / inscription (HTML + API d'auth) : 10 req/min par IP, burst 5.
# Partagee par ces routes : le quota est commun. Les operateurs mobiles maliens
# sont en CGNAT (beaucoup d'acheteurs derriere une IP) : la finesse par numero
# est assuree cote Django (axes, core/services/rate_limit.py), pas ici.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ── Upstream Gunicorn ──────────────────────────────────────────────────────────
upstream django {
    server web:8000;
    keepalive 32;
}

# ── Serveur unique, HTTP seulement (TLS termine par le Nginx de l'HOTE) ────────
# Le conteneur n'est publie que sur 127.0.0.1:8010 (docker-compose.production.yml,
# port PROVISOIRE, a confirmer en Phase 4). Le vhost HestiaCP de l'hote termine
# TLS, redirige HTTP -> HTTPS et fait proxy_pass vers ce port en posant
# X-Forwarded-For / X-Forwarded-Proto. Ne PAS remettre de redirection 301 ni de
# `listen 443` ici : ce serait une boucle de redirection derriere l'hote.
#
# Schema vu par Django (SECURE_PROXY_SSL_HEADER, prod.py:40) : c'est celui du
# client final, pose par l'hote. Sans en-tete (appel direct sur le port local,
# ex. smoke test / healthcheck), on retombe sur le schema de cette connexion.
map $http_x_forwarded_proto $hf_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# F-04 : /media/ ne sert "inline" que les types que l'application produit
# (images + audio, cf. core/validators.py) ; tout le reste (html, svg, js,
# pdf, fichiers herites...) est force en telechargement.
map $uri $hf_media_disposition {
    default                                          "attachment";
    ~*\.(jpe?g|png|webp|webm|ogg|mp3|m4a|wav)$   "inline";
}

server {
    listen 80;
    server_name ${PROD_DOMAIN};

    # ── IP reelle du client (F-26) ────────────────────────────────────────────
    # Ici, $remote_addr = l'IP du Nginx de l'HOTE, pas celle du client. Le module
    # realip la remplace par l'IP cliente lue dans X-Forwarded-For, mais UNIQUEMENT
    # si la connexion vient d'une adresse declaree par set_real_ip_from ; avec
    # real_ip_recursive, il remonte la chaine jusqu'a la 1re adresse non
    # declaree (= le vrai client, meme si celui-ci a forge le debut de l'en-tete).
    #
    # À REMPLACER par l'IP réelle du Nginx hôte en Phase 4 (P4-6 / P4-7) : cette
    # valeur est INCONNUE depuis le depot (passerelle du reseau Docker vue depuis
    # le conteneur, ex. 172.x.0.1, ou 127.0.0.1 selon le mode reseau). Tant que la
    # ligne reste commentee, realip est inactif : $remote_addr reste l'IP de
    # l'hote (repli sans danger, mais tous les clients partagent alors la meme
    # cle de limit_req et la meme IP cote Django).
    #   set_real_ip_from 172.17.0.1;   # EXEMPLE — a remplacer / verifier
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    # Cote hote (vhost HestiaCP) : proxy_set_header X-Forwarded-For $remote_addr;
    # (ou $proxy_add_x_forwarded_for) et X-Forwarded-Proto $scheme.

    # Sécurité HTTP headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
    keepalive_timeout 65;

    # ── Compression des réponses dynamiques (HTML Django, JSON API, HTMX) ──────
    # Les fichiers statiques sont déjà pré-compressés par WhiteNoise/Brotli et
    # servis via gzip_static ci-dessous : ce bloc couvre les réponses générées
    # à la volée (proxy_pass vers Gunicorn) qui n'étaient pas compressées.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Fichiers statiques (WhiteNoise via Django, ou direct Nginx) ─────────────
    location /static/ {
        alias /srv/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nginx n'herite des add_header du bloc server QUE si le bloc location n'en
        # definit aucun : ici Cache-Control en definit un, donc les en-tetes de
        # securite sont repetes (F-22). Garde-fou : core/tests_nginx_headers.py.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        gzip_static on;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Nginx n'herite des add_header du bloc server QUE si le bloc location n'en
        # definit aucun : ici Cache-Control en definit un, donc les en-tetes de
        # securite sont repetes (F-22). Garde-fou : core/tests_nginx_headers.py.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # F-04 : contenu uploade par des tiers = jamais rendu comme une page.
        # CSP sandbox : meme un HTML/SVG ouvert directement s'execute sans
        # script ni origine ; Content-Disposition: attachment force le
        # telechargement pour tout type non attendu (voir $hf_media_disposition).
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition $hf_media_disposition always;
        access_log off;
    }

    # ── API orders : rate limit strict ─────────────────────────────────────────
    location /api/v1/orders/ {
        limit_req zone=api_orders burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited_json;

        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Reponse 429 JSON (API) : le front Alpine lit `detail` (premier message) ──
    location @rate_limited_json {
        default_type application/json;
        return 429 '{"detail": ["Trop de requêtes depuis ce réseau. Réessayez dans une minute."]}';
    }

    # ── API d'auth (F-19 : encore routee) : meme zone que login/inscription ─────
    location /api/v1/accounts/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited_json;

        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Endpoints auth : rate limit anti-brute-force ────────────────────────────
    location ~ ^/(login|register|otp)/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Tout le reste ─────────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
    }

    # ── Health check interne (pas de rate limit, pas de log) ──────────────────
    location = /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
    }
}
