# infra/nginx/prod.conf — Reverse proxy HayaFlash (production)
#
# NOTE — templating : ce fichier est monté en tant que template envsubst
# (/etc/nginx/templates/default.conf.template dans docker-compose.production.yml),
# PAS en tant que .conf statique. C'est l'entrypoint officiel de l'image
# nginx qui exécute `envsubst` dessus au démarrage du conteneur et écrit le
# résultat dans /etc/nginx/conf.d/default.conf. Il ne substitue QUE les
# variables réellement présentes dans l'environnement du conteneur nginx
# (voir `environment: PROD_DOMAIN` sur le service nginx) — les variables
# nginx natives comme $host, $remote_addr, $scheme, etc. ne matchent aucun
# nom de variable d'environnement et restent donc intactes.

# ── Rate limiting zones ────────────────────────────────────────────────────────
# Zone générale : 30 req/s par IP
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
# Zone API orders : 120 req/min (2 r/s) par IP, burst 40 (anti-flood ; CGNAT :
# large volontairement, la finesse est par numero cote Django). Django applique
# le meme plafond (ORDER_SUBMIT_RATE_MAX_PER_WINDOW) : a relever ensemble.
limit_req_zone $binary_remote_addr zone=api_orders:10m rate=120r/m;
# Zone login / inscription (HTML + API d'auth) : 10 req/min par IP, burst 5.
# Partagee par ces routes : le quota est commun. Les operateurs mobiles maliens
# sont en CGNAT (beaucoup d'acheteurs derriere une IP) : la finesse par numero
# est assuree cote Django (axes, core/services/rate_limit.py), pas ici.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ── Journal d'accès sans le jeton des liens privés (F-109) ────────────────────
# Le jeton de /partenaires/d/<jeton>/ fait partie de l'URL. Il apparaîtrait dans l'URI journalisée ET dans le
# Referer des ressources de la page (même origine, Referrer-Policy: same-origin). Le format ci-dessous n'emploie
# jamais $request, $request_uri, $uri, $args ni $http_referer bruts : seulement leurs versions masquées.
# Garde-fou : core/tests_private_token_logs.py. (Les noms $hf_pfx, $hf_rest... ne sont pas des variables
# d'environnement : envsubst ne les touche pas.)
map $request_uri $hf_logged_uri {
    default $request_uri;
    ~^(?<hf_pfx>/partenaires/d/)[^/?]+(?<hf_rest>.*)$ "${hf_pfx}***${hf_rest}";
}
map $http_referer $hf_logged_referer {
    default $http_referer;
    ~^(?<hf_rpfx>.*?/partenaires/d/)[^/?]+(?<hf_rrest>.*)$ "${hf_rpfx}***${hf_rrest}";
}
log_format hf_masked '$remote_addr - $remote_user [$time_local] "$request_method $hf_logged_uri $server_protocol" '
                     '$status $body_bytes_sent "$hf_logged_referer" "$http_user_agent"';

# ── Upstream Gunicorn (resolution DNS dynamique, PP-04 / F-83) ─────────────────
# Un bloc `upstream { server web:8000; }` resout `web` UNE fois au demarrage de
# nginx : apres `up -d --no-deps web` (nouvelle IP), nginx continuait d'envoyer
# vers l'ancienne -> 502 jusqu'a `restart nginx`. On passe donc par une VARIABLE
# dans chaque proxy_pass : nginx la resout a l'execution via le DNS interne de
# Docker (127.0.0.11), avec un cache de 10 s.
# Contrepartie assumee : plus de `keepalive` vers Gunicorn (cela exige un bloc
# upstream) ; une connexion TCP locale par requete sur le reseau Docker est
# negligeable ici. Garde-fou : core/tests_nginx_dynamic_upstream.py.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── Serveur unique, HTTP seulement (TLS termine par le Nginx de l'HOTE) ────────
# Le conteneur n'est publie que sur 127.0.0.1, port HAYAFLASH_HTTP_PORT (8020 staging,
# 8021 prod ; docker-compose.production.yml). Le vhost HestiaCP de l'hote termine
# TLS, redirige HTTP -> HTTPS et fait proxy_pass vers ce port en posant
# X-Forwarded-For / X-Forwarded-Proto. Ne PAS remettre de redirection 301 ni de
# `listen 443` ici : ce serait une boucle de redirection derriere l'hote.
#
# Schema vu par Django (SECURE_PROXY_SSL_HEADER, prod.py:40) : c'est celui du
# client final, pose par l'hote. Sans en-tete (appel direct sur le port local,
# ex. smoke test / healthcheck), on retombe sur le schema de cette connexion.
map $http_x_forwarded_proto $hf_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# F-04 : /media/ ne sert "inline" que les types que l'application produit
# (images + audio, cf. core/validators.py) ; tout le reste (html, svg, js,
# pdf, fichiers herites...) est force en telechargement.
map $uri $hf_media_disposition {
    default                                          "attachment";
    ~*\.(jpe?g|png|webp|webm|ogg|mp3|m4a|wav)$   "inline";
}

server {
    listen 80;
    server_name ${PROD_DOMAIN};

    # Cible Gunicorn, resolue a chaque requete (voir `resolver` plus haut).
    set $hf_upstream "web:8000";

    # Journal d'accès masqué (F-109). Le fichier est le lien vers la sortie standard de l'image officielle :
    # `docker logs` continue de fonctionner.
    access_log /var/log/nginx/access.log hf_masked;

    # ── IP reelle du client (F-26) ────────────────────────────────────────────
    # Ici, $remote_addr = l'IP du Nginx de l'HOTE, pas celle du client. Le module
    # realip la remplace par l'IP cliente lue dans X-Forwarded-For, mais UNIQUEMENT
    # si la connexion vient d'une adresse declaree par set_real_ip_from ; avec
    # real_ip_recursive, il remonte la chaine jusqu'a la 1re adresse non
    # declaree (= le vrai client, meme si celui-ci a forge le debut de l'en-tete).
    #
    # Le port du conteneur n'est publie que sur 127.0.0.1 : la seule connexion
    # qui arrive ici est celle du Nginx de l'hote, vue depuis le reseau Docker
    # comme la passerelle du bridge (172.x.0.1). HF_REAL_IP_FROM (compose,
    # defaut 172.16.0.0/12 = plages bridge Docker) liste les adresses de
    # confiance ; resserrer sur le sous-reseau reel de la pile apres
    # `docker network inspect <projet>_default` (F-26 / P4-7). Un client ne
    # peut pas se faire passer pour l'hote : il n'atteint pas ce port.
    # Verification de bout en bout sur le VPS : RUNBOOK_JOUR_J.md (IP reelle).
    set_real_ip_from ${HF_REAL_IP_FROM};
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    # Cote hote (vhost HestiaCP) : proxy_set_header X-Forwarded-For $remote_addr;
    # (ou $proxy_add_x_forwarded_for) et X-Forwarded-Proto $scheme.

    # Sécurité HTTP headers
    # Strict-Transport-Security : défini UNE SEULE FOIS, par Django (SECURE_HSTS_* de
    # config/settings/prod.py : 180 jours, sans preload ni includeSubDomains). Ne pas
    # le remettre ici : l'en-tête partirait en double (Django + nginx).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
    keepalive_timeout 65;

    # ── Compression des réponses dynamiques (HTML Django, JSON API, HTMX) ──────
    # Les fichiers statiques sont déjà pré-compressés par WhiteNoise/Brotli et
    # servis via gzip_static ci-dessous : ce bloc couvre les réponses générées
    # à la volée (proxy_pass vers Gunicorn) qui n'étaient pas compressées.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Fichiers statiques (WhiteNoise via Django, ou direct Nginx) ─────────────
    location /static/ {
        alias /srv/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nginx n'herite des add_header du bloc server QUE si le bloc location n'en
        # definit aucun : ici Cache-Control en definit un, donc les en-tetes de
        # securite sont repetes (F-22). Garde-fou : core/tests_nginx_headers.py.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        gzip_static on;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Nginx n'herite des add_header du bloc server QUE si le bloc location n'en
        # definit aucun : ici Cache-Control en definit un, donc les en-tetes de
        # securite sont repetes (F-22). Garde-fou : core/tests_nginx_headers.py.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # F-04 : contenu uploade par des tiers = jamais rendu comme une page.
        # CSP sandbox : meme un HTML/SVG ouvert directement s'execute sans
        # script ni origine ; Content-Disposition: attachment force le
        # telechargement pour tout type non attendu (voir $hf_media_disposition).
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition $hf_media_disposition always;
        access_log off;
    }

    # ── Notes vocales des clients (E4) ─────────────────────────────────────────
    # Jamais servies directement : plus spécifique que /media/ (donc prioritaire), refus neutre.
    location ^~ /media/delivery/audio/ {
        return 404;
    }

    # Location INTERNE : atteignable seulement par un X-Accel-Redirect que Django renvoie à la vue authentifiée
    # seller_delivery_audio (un client HTTP qui demande /_protected_media/... reçoit 404). Content-Type et
    # Content-Disposition viennent de la réponse Django ; Range est géré par Nginx (lecture audio).
    location /_protected_media/ {
        internal;
        alias /srv/media/;
        access_log off;
        # add_header dans une location désactive l'héritage du bloc server (F-22) : les en-têtes sont répétés.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        # Pas de Cache-Control ici : Nginx conserve celui que Django envoie (« private, no-store ») ; en poser un
        # deuxième le dupliquerait (vérifié dans un conteneur).
    }

    # ── API orders : rate limit strict ─────────────────────────────────────────
    location /api/v1/orders/ {
        limit_req zone=api_orders burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited_json;

        proxy_pass         http://$hf_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Reponse 429 JSON (API) : le front Alpine lit `detail` (premier message) ──
    location @rate_limited_json {
        default_type application/json;
        return 429 '{"detail": ["Trop de requêtes depuis ce réseau. Réessayez dans une minute."]}';
    }

    # ── API d'auth (F-19 : encore routee) : meme zone que login/inscription ─────
    location /api/v1/accounts/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited_json;

        proxy_pass         http://$hf_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Endpoints auth : rate limit anti-brute-force ────────────────────────────
    location ~ ^/(login|register|otp)/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://$hf_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Liens privés du programme partenaires (F-109) ──────────────────────────
    # Le journal d'ERREUR de Nginx cite la requête, l'URL amont et le Referer en clair (jeton compris) quand le
    # service Django est injoignable, et son format ne peut pas être modifié. Pour ces seules URL, le niveau est
    # relevé à « crit » : les erreurs amont ordinaires n'y sont plus écrites (le journal d'accès masqué garde la
    # trace du 502). Même réglage que « Tout le reste » pour le reste.
    location ^~ /partenaires/d/ {
        error_log /var/log/nginx/error.log crit;
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://$hf_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
    }

    # ── Tout le reste ─────────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://$hf_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $hf_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
    }

    # ── Health check interne (pas de rate limit, pas de log) ──────────────────
    location = /health/ {
        access_log off;
        proxy_pass http://$hf_upstream;
        proxy_set_header Host $host;
    }
}
