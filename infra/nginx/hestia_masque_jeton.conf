# infra/nginx/hestia_masque_jeton.conf — F-109 : masquer le jeton des liens privés dans le Nginx de l'HÔTE.
#
# NON monté par Docker : ce fichier documente ce qui doit être appliqué À LA MAIN sur le VPS (HestiaCP), après
# validation du mainteneur. Le conteneur Nginx du dépôt (infra/nginx/prod.conf) masque déjà son propre journal ;
# le Nginx de l'hôte termine TLS et écrit lui aussi un journal d'accès, avec l'URL complète (jeton compris) et le
# Referer. Le même masquage doit y être posé.
#
# 1) Niveau « http » : copier les trois blocs ci-dessous dans /etc/nginx/conf.d/hf_masque_jeton.conf
#    (inclus par nginx.conf dans le contexte http).
# 2) Vhost du domaine : remplacer dans le modèle HestiaCP (copie personnalisée du modèle, pas celui de Hestia)
#       access_log /var/log/nginx/domains/<domaine>.log combined;
#    par
#       access_log /var/log/nginx/domains/<domaine>.log hf_masked;
#    (et la même ligne dans le bloc ssl du modèle), puis `v-rebuild-web-domain <utilisateur> <domaine>`.
# 3) `nginx -t && systemctl reload nginx`.
# 4) Vérifier : `curl -sk -o /dev/null https://<domaine>/partenaires/d/TESTJETON1234/` puis
#    `grep -c TESTJETON1234 /var/log/nginx/domains/<domaine>.log` doit afficher 0 ; la ligne doit contenir
#    `/partenaires/d/***/`.
# 5) Les anciennes lignes qui contiennent un vrai jeton restent dans les fichiers déjà écrits et archivés
#    (logrotate) : les purger ou les révoquer (les liens privés se révoquent depuis la fiche partenaire).
# Le journal d'ERREUR de Nginx (error.log) cite la requête fautive en cas d'erreur amont : il ne se reformate pas ;
# à surveiller (retrouver un jeton dans error.log = révoquer le lien).

map $request_uri $hf_logged_uri {
    default $request_uri;
    ~^(?<hf_pfx>/partenaires/d/)[^/?]+(?<hf_rest>.*)$ "${hf_pfx}***${hf_rest}";
}

map $http_referer $hf_logged_referer {
    default $http_referer;
    ~^(?<hf_rpfx>.*?/partenaires/d/)[^/?]+(?<hf_rrest>.*)$ "${hf_rpfx}***${hf_rrest}";
}

log_format hf_masked '$remote_addr - $remote_user [$time_local] "$request_method $hf_logged_uri $server_protocol" '
                     '$status $body_bytes_sent "$hf_logged_referer" "$http_user_agent"';
