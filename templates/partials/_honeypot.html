{# Champs anti-bot (core/services/honeypot.py) : a inclure via {% honeypot_fields %} dans un <form>. #}
{# Piege cache en CSS hors ecran (pas type="hidden", que les robots ignorent) ; jeton = heure d'affichage signee. #}
<div aria-hidden="true" style="position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden;">
  <label for="{{ honeypot_field }}">Site web (laisser vide)</label>
  <input type="text" id="{{ honeypot_field }}" name="{{ honeypot_field }}" value="" tabindex="-1" autocomplete="off">
</div>
<input type="hidden" name="{{ timestamp_field }}" value="{{ token }}">
