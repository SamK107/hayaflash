<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Erreur — HayaFlash</title>
  <!-- Autonome : Django rend la 500 sans contexte. Aucun tag de template (url, static, custom) : un template qui plante masquerait l'erreur. -->
  <style>
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#F5F5F5; color:#1A1A2E; }
    .box { max-width:28rem; margin:12vh auto 0; padding:2rem 1.5rem; background:#fff; border:1.5px solid #EEEEF0; border-radius:1.25rem; text-align:center; }
    .code { font-size:2.75rem; font-weight:900; color:#FF4D2E; line-height:1; margin:0 0 .75rem; }
    h1 { font-size:1.25rem; margin:0 0 .5rem; }
    p { color:#6B7280; font-size:.9rem; line-height:1.6; margin:0 0 1.5rem; }
    a { display:block; text-decoration:none; border-radius:.875rem; padding:.9rem 1rem; font-weight:700; margin-top:.75rem; }
    .main { background:#FF4D2E; color:#fff; }
    .alt { color:#1A1A2E; border:1.5px solid #E5E7EB; font-weight:600; }
    @media (max-width:30rem) { .box { margin:6vh 1rem 0; } }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">500</p>
    <h1>Un problème est survenu, réessayez dans un instant</h1>
    <p>Notre équipe est prévenue. Si le problème continue, revenez un peu plus tard.</p>
    <a class="main" href="/ventes/">Voir les ventes en cours</a>
    <a class="alt" href="/">Accueil</a>
  </div>
</body>
</html>
