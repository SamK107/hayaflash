# docker-compose.production.yml — Production HayaFlash
# Usage : docker compose -f docker-compose.production.yml up -d
# Ne jamais utiliser en développement (pas de volume bind-mount src)
# Nom de projet explicite (requiert Docker Compose >= 2.20, la syntaxe
# `name:` top-level de la Compose Specification). Sans ça, docker compose
# derive le nom du projet du nom du dossier courant — fragile si un autre
# projet sur le meme VPS est lance depuis un dossier au nom similaire.
# Garantit que le reseau par defaut (<projet>_default), les volumes et
# `docker compose down/up` restent scopes a ce projet uniquement.
#
# PLUSIEURS PILES SUR UN MEME VPS (PP-04) : ce fichier est unique, chaque pile
# (clone git) a son propre `.env` A COTE de ce fichier. Compose lit ce `.env`
# pour l'interpolation (name, port, image) ET le passe aux conteneurs :
#   staging (/srv/hayaflash)      : valeurs par defaut ci-dessous (rien a poser)
#   prod    (/srv/hayaflash-prod) : HAYAFLASH_PROJECT=hayaflash-prod
#                                   HAYAFLASH_HTTP_PORT=8021
#                                   DOCKER_IMAGE=hayaflash-prod
# Les volumes (postgres_data...) et le reseau prennent le nom du projet :
# `hayaflash_postgres_data` (staging) vs `hayaflash-prod_postgres_data` (prod).
# Les valeurs par defaut = le staging actuel : ne JAMAIS les changer, la base
# de staging repartirait vide. Controle : infra/scripts/check_stack_isolation.sh
name: ${HAYAFLASH_PROJECT:-hayaflash}

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  ENVIRONMENT: prod

x-django-base: &django-base
  image: "${DOCKER_IMAGE:-hayaflash}:${IMAGE_TAG:-latest}"
  env_file: .env
  environment:
    <<: *django-env
  volumes:
    - media_data:/app/media
    - static_data:/app/staticfiles
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"
  # Limites memoire/CPU (compose "classique", pas Swarm — `deploy.resources`
  # est ignore hors Swarm). A ajuster aux specs reelles du VPS et a ce qui
  # tourne a cote (ex: services.symain) pour eviter qu'un pic hayaflash
  # n'affame l'hote.
  mem_limit: 512m
  cpus: 1.0

services:
  # ── Base de données ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hayaflash}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1.0

  # ── Cache / Broker ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    mem_limit: 320m
    cpus: 0.5

  # ── Django Web (Gunicorn) ─────────────────────────────────────────────────────
  web:
    <<: *django-base
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --worker-class gthread
        --threads 2
        --timeout 60
        --max-requests 1000
        --max-requests-jitter 100
        --logger-class config.gunicorn_logging.MaskedLogger
        --access-logfile -
        --error-logfile -
    expose:
      - "8000"
    healthcheck:
      # X-Forwarded-Proto: sans lui, SECURE_SSL_REDIRECT repond 301 (accepte par
      # curl -f) et la vue /health/ ne s'execute jamais (F-56). Pas de -L (voir Dockerfile).
      test: ["CMD-SHELL", "curl -sf -H 'X-Forwarded-Proto: https' http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx (reverse proxy + static) ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    # env_file (et non `environment: ${PROD_DOMAIN}`) : la substitution
    # `${VAR}` du compose file est résolue par le CLI docker compose depuis
    # l'environnement du shell hôte / un .env à côté de ce fichier, ce qui
    # n'est jamais garanti sur le VPS (nginx est démarré une fois puis jamais
    # retouché par deploy.sh). En passant par le même .env (à côté de ce fichier)
    # que les autres services (voir x-django-base), PROD_DOMAIN atterrit
    # directement dans l'environnement du conteneur nginx, où l'entrypoint
    # envsubst le lit pour substituer server_name / ssl_certificate dans
    # prod.conf (monté en template ci-dessous). Sans cette variable, nginx
    # démarre avec un ${PROD_DOMAIN} littéral dans le chemin du certificat
    # et plante au boot.
    env_file: .env
    environment:
      # IP(s) de confiance pour real_ip (F-26) : passerelle du reseau Docker de la
      # pile. Plage bridge par defaut ; a resserrer (HF_REAL_IP_FROM dans le .env).
      HF_REAL_IP_FROM: ${HF_REAL_IP_FROM:-172.16.0.0/12}
    # VPS partage avec services.symain.africa : le Nginx de l'HOTE (HestiaCP)
    # garde 80/443 et termine TLS. Ce conteneur n'ecoute qu'en HTTP et n'est
    # joignable que depuis l'hote, sur un port dedie en loopback (F-21).
    # Port par defaut 8020 (staging ; 8010 est occupe par un autre site du VPS),
    # 8021 pour la pile prod via HAYAFLASH_HTTP_PORT. Le vhost HestiaCP fait
    # proxy_pass vers ce port.
    ports:
      - "127.0.0.1:${HAYAFLASH_HTTP_PORT:-8020}:80"
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      - web
    restart: always
    mem_limit: 128m
    cpus: 0.5

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  worker:
    <<: *django-base
    command: celery -A config worker -l info -c 4 -Q default,flash_sales,notifications
    healthcheck:
      # CMD-SHELL (et non CMD) : en forme CMD, `$$HOSTNAME` n'est jamais resolu
      # par un shell et le ping cible un worker inexistant (F-63). `$$` = `$`
      # litteral pour Compose ; le shell du conteneur developpe $HOSTNAME.
      test: ["CMD-SHELL", "celery -A config inspect ping -t 10 -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s

  # ── Celery Beat ───────────────────────────────────────────────────────────────
  beat:
    <<: *django-base
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # Beat n'ecoute sur aucun port et n'a pas de commande de sonde fiable
    # (pas de pidfile ; `inspect ping` ne cible que les workers). Sans cette
    # ligne il heriterait du HEALTHCHECK curl :8000 du Dockerfile, qui echoue
    # toujours ici (F-63/F-117). Sa vivacite est observee autrement : le
    # battement `core.celery_heartbeat` (check « celery » de /health/) n'est
    # emis que si beat tourne ET que le worker consomme.
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
