# docker-compose.production.yml — Production HayaFlash
# Usage : docker compose -f docker-compose.production.yml up -d
# Ne jamais utiliser en développement (pas de volume bind-mount src)

# Nom de projet explicite (requiert Docker Compose >= 2.20, la syntaxe
# `name:` top-level de la Compose Specification). Sans ça, docker compose
# derive le nom du projet du nom du dossier courant — fragile si un autre
# projet sur le meme VPS est lance depuis un dossier au nom similaire.
# Garantit que le reseau par defaut (hayaflash_default), les volumes et
# `docker compose down/up` restent scopes a ce projet uniquement, meme
# sans passer `-p hayaflash` explicitement a chaque invocation (deploy.sh
# le passe quand meme, en ceinture-bretelles).
name: hayaflash

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  ENVIRONMENT: prod

x-django-base: &django-base
  image: "${DOCKER_IMAGE:-hayaflash}:${IMAGE_TAG:-latest}"
  env_file: /srv/hayaflash/.env
  environment:
    <<: *django-env
  volumes:
    - media_data:/app/media
    - static_data:/app/staticfiles
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"
  # Limites memoire/CPU (compose "classique", pas Swarm — `deploy.resources`
  # est ignore hors Swarm). A ajuster aux specs reelles du VPS et a ce qui
  # tourne a cote (ex: services.symain) pour eviter qu'un pic hayaflash
  # n'affame l'hote.
  mem_limit: 512m
  cpus: 1.0

services:
  # ── Base de données ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    env_file: /srv/hayaflash/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hayaflash}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1.0

  # ── Cache / Broker ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    mem_limit: 320m
    cpus: 0.5

  # ── Django Web (Gunicorn) ─────────────────────────────────────────────────────
  web:
    <<: *django-base
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --worker-class gthread
        --threads 2
        --timeout 60
        --max-requests 1000
        --max-requests-jitter 100
        --access-logfile -
        --error-logfile -
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx (reverse proxy + static) ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    # env_file (et non `environment: ${PROD_DOMAIN}`) : la substitution
    # `${VAR}` du compose file est résolue par le CLI docker compose depuis
    # l'environnement du shell hôte / un .env à côté de ce fichier, ce qui
    # n'est jamais garanti sur le VPS (nginx est démarré une fois puis jamais
    # retouché par deploy.sh). En passant par le même /srv/hayaflash/.env que
    # les autres services (voir x-django-base), PROD_DOMAIN atterrit
    # directement dans l'environnement du conteneur nginx, où l'entrypoint
    # envsubst le lit pour substituer server_name / ssl_certificate dans
    # prod.conf (monté en template ci-dessous). Sans cette variable, nginx
    # démarre avec un ${PROD_DOMAIN} littéral dans le chemin du certificat
    # et plante au boot.
    env_file: /srv/hayaflash/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: always
    mem_limit: 128m
    cpus: 0.5

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  worker:
    <<: *django-base
    command: celery -A config worker -l info -c 4 -Q default,flash_sales,notifications
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3

  # ── Celery Beat ───────────────────────────────────────────────────────────────
  beat:
    <<: *django-base
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
